[pytest]
# Ikkala pipeline'ning testlari.
testpaths = Indexing Retrieval_Generation UI/backend/tests
# config/, Indexing paketlari va Retrieval_Generation bosqichlarini import qilish uchun.
# (Retrieval_Generation/conftest.py qolgan 0X_ papkalarni rag_paths orqali qo'shadi.)
pythonpath =
    .
    Indexing
    Indexing/02_document_loading/src
    Indexing/03_chunking/src
    Indexing/04_embedding_model/src
    Indexing/05_vector_database/src
    Retrieval_Generation
markers =
    slow: downloads or loads an embedding model / tokenizer
    integration: needs a running Qdrant server (QDRANT_URL)
filterwarnings =
    ignore::DeprecationWarning
