[pytest]
testpaths = indexing_pipeline/tests
# Lets tests import `config` (project root) and each pipeline's package without installing anything.
# Add `retrieval_generation_pipeline/src` here when that pipeline is created.
pythonpath = . indexing_pipeline/src
markers =
    slow: downloads or loads an embedding model / tokenizer
    integration: needs a running Qdrant server (QDRANT_URL)
filterwarnings =
    ignore::DeprecationWarning
