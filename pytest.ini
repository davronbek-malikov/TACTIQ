[pytest]
# Every step folder has its own tests/ — pytest finds them all under Indexing/.
testpaths = Indexing
# Lets tests import `config` (project root), `indexing_pipeline` (Indexing/) and every step package.
# Add the Retrieval & Generation src folders here when that pipeline is created.
pythonpath =
    .
    Indexing
    Indexing/02_document_loading/src
    Indexing/03_chunking/src
    Indexing/04_embedding_model/src
    Indexing/05_vector_database/src
markers =
    slow: downloads or loads an embedding model / tokenizer
    integration: needs a running Qdrant server (QDRANT_URL)
filterwarnings =
    ignore::DeprecationWarning
